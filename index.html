  }).catch(function (e) { clear(box).appendChild(msgBox('err', e.message)); });
};

// ---------------------------------------------------------------- Estate setup
VIEWS['estate.manage'] = function (root) {
  const out = h('div');
  let data = null, openDiv = null;
  const headActions = h('div', { class: 'row' });
  root.appendChild(pageHead('Estate setup', 'Create the estate, then its divisions and fields. Every field needs its area, last prune date, tea type and drone area (the part sprayed by drone) before it can be used.', headActions));
  root.appendChild(out);
  refresh();

  function refresh() {
    return api('api_getEstate').then(function (d) { data = d; render(); }).catch(function (e) { clear(out).appendChild(msgBox('err', e.message)); });
  }
  function render() {
    clear(out);
    if (!data.estate) return createEstateCard();
    if (openDiv) { const dv = data.divisions.filter(function (x) { return x.division_id === openDiv; })[0]; if (dv) return gridView(dv); openDiv = null; }
    overview();
  }

  function createEstateCard() {
    const name = h('input', { type: 'text', maxlength: '80', placeholder: 'e.g. Pedro Estate' });
    const n = numInput('', { step: '1', min: '1', max: '30', placeholder: 'e.g. 5' });
    const msg = h('div');
    out.appendChild(h('div', { class: 'card stack' }, h('h2', null, 'Create the estate'),
      help('Enter the estate name and how many divisions it has. The divisions are created for you; you then add the fields to each.'),
      h('div', { class: 'row' }, h('div', { class: 'grow' }, field('Estate name', name)), h('div', { class: 'grow' }, field('Number of divisions', n))), msg,
      h('div', null, h('button', { class: 'btn primary', onclick: function (ev) {
        run(ev.currentTarget, function () { return api('api_createEstate', { name: name.value, division_count: n.value }).then(function () { toast('Estate created'); return refresh(); }).catch(function (e) { clear(msg).appendChild(msgBox('err', e.message)); }); });
      } }, 'Create estate'))));
  }

  function overview() {
    const act = data.fields.filter(function (f) { return f.active; });
    const haOf = function (l, k) { return l.reduce(function (t, f) { return t + (f[k || 'area_ha'] || 0); }, 0); };
    const dr = act.filter(function (f) { return f.drone_ha > 0; }), ma = act.filter(function (f) { return f.manual_ha > 0; });
    const complete = act.filter(function (f) { return f.complete; }).length;
    clear(headActions);
    headActions.appendChild(h('button', { class: 'btn', onclick: renameEstate }, 'Rename estate'));
    headActions.appendChild(h('button', { class: 'btn', onclick: addDivisionsDialog }, icon('plus'), 'Add divisions'));
    out.appendChild(h('div', { class: 'kpis four' },
      kpi('neutral', 'Estate', data.estate.name, data.divisions.length + ' divisions', 'leaf'),
      kpi('neutral', 'Fields', act.length, complete + ' filled in', 'map'),
      kpi('drone', 'Drone spraying', num(haOf(dr, 'drone_ha'), 1) + ' ha', dr.length + ' fields have a drone part', 'wind'),
      kpi('manual', 'Manual spraying', num(haOf(ma, 'manual_ha'), 1) + ' ha', ma.length + ' fields have a manual part', 'tractor')));
    const grid = h('div', { class: 'divgrid' });
    data.divisions.forEach(function (d) {
      const mine = data.fields.filter(function (f) { return f.division_id === d.division_id && f.active; });
      const drn = mine.filter(function (f) { return f.method === 'Drone'; }).length, man = mine.filter(function (f) { return f.method === 'Manual'; }).length, mix = mine.filter(function (f) { return f.method === 'Mixed'; }).length;
      const cnt = numInput('', { step: '1', min: '1', max: '300', placeholder: 'How many?', class: 'w120' });
      grid.appendChild(h('div', { class: 'card divcard' },
        h('div', { class: 'row between', style: 'margin-bottom:8px' }, h('h2', { style: 'margin:0' }, d.name, d.active ? '' : ' (inactive)'), h('button', { class: 'btn small ghost', onclick: function () { renameDivision(d); } }, 'Rename')),
        h('div', { class: 'mini' }, h('span', { class: 'muted' }, num(haOf(mine), 1) + ' ha'), drn ? badge(drn + ' Drone', 'drone') : null, mix ? badge(mix + ' Mixed', 'mixed') : null, man ? badge(man + ' Manual', 'manual') : null),
        h('div', { class: 'muted', style: 'margin:12px 0 6px' }, d.field_count + ' fields: ' + d.complete_count + ' complete, ' + d.assigned_count + ' with an AFO'),
        h('div', { class: 'progress', style: 'margin-bottom:16px' }, h('i', { style: 'width:' + (d.field_count ? Math.round(d.complete_count / d.field_count * 100) : 0) + '%' })),
        d.field_count ? h('button', { class: 'btn primary', style: 'width:100%;margin-bottom:14px', onclick: function () { openDiv = d.division_id; render(); } }, 'Fill in the fields') : null,
        h('div', { class: 'row', style: 'align-items:flex-end;padding-top:14px;border-top:1px solid var(--line)' },
          h('div', { class: 'grow' }, field('Add fields to this division', cnt)),
          h('button', { class: 'btn', onclick: function (ev) { run(ev.currentTarget, function () { return api('api_addFields', d.division_id, cnt.value).then(function (n) { toast(n + ' fields added'); openDiv = d.division_id; return refresh(); }); }); } }, 'Create fields'))));
    });
    out.appendChild(grid);
  }
  function addDivisionsDialog() {
    const more = numInput('', { step: '1', min: '1', max: '30', placeholder: 'e.g. 2' }), err = h('div');
    modal('Add divisions', h('div', { class: 'stack' }, field('How many divisions to add?', more), err), [
      { label: 'Cancel', onclick: function (m) { m.close(); } },
      { label: 'Add', kind: 'primary', onclick: function (m, btn) { run(btn, function () { return api('api_addDivisions', more.value).then(function (n) { m.close(); toast(n + ' divisions added'); return refresh(); }).catch(function (e) { clear(err).appendChild(msgBox('err', e.message)); }); }); } }]);
  }

  function renameEstate() {
    const name = h('input', { type: 'text', value: data.estate.name, maxlength: '80' }), err = h('div');
    modal('Rename estate', h('div', { class: 'stack' }, field('Estate name', name), err), [
      { label: 'Cancel', onclick: function (m) { m.close(); } },
      { label: 'Save', kind: 'primary', onclick: function (m, b) { run(b, function () { return api('api_renameEstate', name.value).then(function () { m.close(); return refresh(); }).catch(function (e) { clear(err).appendChild(msgBox('err', e.message)); }); }); } }]);
  }
  function renameDivision(d) {
    const name = h('input', { type: 'text', value: d.name, maxlength: '60' });
    const act = select([{ value: 'true', label: 'Active' }, { value: 'false', label: 'Inactive' }], String(d.active)), err = h('div');
    modal('Division', h('div', { class: 'stack' }, field('Division name', name), field('Status', act), err), [
      { label: 'Cancel', onclick: function (m) { m.close(); } },
      { label: 'Save', kind: 'primary', onclick: function (m, b) { run(b, function () { return api('api_saveDivision', { division_id: d.division_id, name: name.value, active: act.value === 'true' }).then(function () { m.close(); return refresh(); }).catch(function (e) { clear(err).appendChild(msgBox('err', e.message)); }); }); } }]);
  }

  // The grid: one row per field; fill in area, drone area (the rest is sprayed by hand), last prune date and VP/SD.
  function gridView(dv) {
    const rows = data.fields.filter(function (f) { return f.division_id === dv.division_id; }).map(function (f) {
      return { f: f,
        code: h('input', { type: 'text', value: f.code, maxlength: '20', class: 'w90' }), name: h('input', { type: 'text', value: f.name, maxlength: '80', placeholder: 'optional' }),
        area: numInput(f.area_ha, { step: '0.01', class: 'w90' }), prune: h('input', { type: 'date', value: f.last_prune_date || '', max: S.today }),
        tea: select([{ value: '', label: '-' }, { value: 'VP', label: 'VP' }, { value: 'SD', label: 'SD' }], f.tea_type),
        drone: numInput(f.drone_ha, { step: '0.01', class: 'w90', placeholder: 'ha' }), manual: h('span', { class: 'small' }),
        active: h('input', { type: 'checkbox', checked: f.active }) };
    });
    const msg = h('div');
    /** the manual part is what is left of the field after the drone part; shown as the person types */
    function showManual(r) {
      const a = parseFloat(r.area.value), d = parseFloat(r.drone.value);
      r.manual.textContent = r.drone.value === '' || !(a > 0) ? '' : (d > a + 0.006 || d < 0 ? 'more than the field' : num(Math.round((a - d) * 100) / 100, 2) + (d <= 0 ? '  (all manual)' : (a - d < 0.05 ? '  (all drone)' : '')));
      r.manual.style.color = r.manual.textContent === 'more than the field' ? 'var(--bad)' : '';
    }
    rows.forEach(function (r) { showManual(r); r.area.addEventListener('input', function () { showManual(r); }); r.drone.addEventListener('input', function () { showManual(r); }); });
    const fillTea = select([{ value: '', label: 'Tea type...' }, { value: 'VP', label: 'VP' }, { value: 'SD', label: 'SD' }], '');
    const fillMeth = select([{ value: '', label: 'Spraying...' }, { value: 'Drone', label: 'All drone' }, { value: 'Manual', label: 'All manual' }], '');
    const fillPrune = h('input', { type: 'date', max: S.today }), fillArea = numInput('', { step: '0.01', placeholder: 'ha', class: 'w90' });
    function save(btn) {
      clear(msg);
      const payload = rows.map(function (r) { return { field_id: r.f.field_id, code: r.code.value, name: r.name.value, area_ha: r.area.value, last_prune_date: r.prune.value, tea_type: r.tea.value, drone_ha: r.drone.value, active: r.active.checked }; });
      run(btn, function () { return api('api_saveFields', dv.division_id, payload).then(function (r) { toast(r.changed ? r.changed + ' fields saved' : 'Nothing had changed'); return api('api_getEstate').then(function (d) { data = d; msg.appendChild(msgBox('ok', r.changed ? 'Saved.' : 'Nothing had changed.')); }); }).catch(function (e) { msg.appendChild(msgBox('err', e.message)); }); });
    }
    const saveBtn = h('button', { class: 'btn primary', onclick: function (ev) { save(ev.currentTarget); } }, 'Save all fields');
    out.appendChild(h('div', { class: 'card' },
      h('div', { class: 'row', style: 'justify-content:space-between;align-items:center' }, h('h2', { style: 'margin:0' }, dv.name + ': fields'),
        h('div', { class: 'row' }, h('button', { class: 'btn', onclick: function () { openDiv = null; refresh(); } }, 'Back to divisions'), saveBtn)),
      help('For every field enter the area, the drone area, the last pruning date and the tea type. The drone area is the part of the field that the drone sprays; the rest is sprayed by hand. Enter 0 if the whole field is sprayed by hand, or the whole area if it is all by drone. Fields that are not complete cannot be used for data entry.'),
      h('div', { class: 'row fillbar' }, h('strong', { class: 'small' }, 'Fill empty cells in all rows:'), fillTea, fillMeth, fillPrune, fillArea,
        h('button', { class: 'btn small', onclick: function () {
          rows.forEach(function (r) {
            if (fillTea.value && !r.tea.value) r.tea.value = fillTea.value;
            if (fillPrune.value && !r.prune.value) r.prune.value = fillPrune.value; if (fillArea.value && !r.area.value) r.area.value = fillArea.value;
            if (fillMeth.value && r.drone.value === '' && r.area.value !== '') r.drone.value = fillMeth.value === 'Drone' ? r.area.value : '0';
            showManual(r);
          });
        } }, 'Apply')),
      msg,
      h('div', { class: 'tablewrap scroll' }, h('table', { class: 'grid-edit' }, h('thead', null, h('tr', null, ['Code', 'Name', 'Area (ha)', 'Drone area (ha)', 'Manual area (ha)', 'Last prune date', 'Tea type', 'AFO', 'Active'].map(function (x) { return h('th', null, x); }))),
        h('tbody', null, rows.map(function (r) {
          return h('tr', { class: r.f.complete ? '' : 'incomplete' }, h('td', null, r.code), h('td', null, r.name), h('td', null, r.area), h('td', null, r.drone), h('td', null, r.manual), h('td', null, r.prune), h('td', null, r.tea),
            h('td', { class: 'small' }, r.f.afo_name ? r.f.afo_name + (r.f.afo_active ? '' : ' (inactive)') : h('span', { class: 'muted' }, 'none')), h('td', null, r.active));
        })))),
      h('div', { style: 'margin-top:12px' }, h('button', { class: 'btn primary', onclick: function (ev) { save(ev.currentTarget); } }, 'Save all fields'))));
  }
};

// ---------------------------------------------------------------- Users (and AFO field assignment)
VIEWS['users.manage'] = function (root) {
  const out = h('div');
  const newUserBtn = h('button', { class: 'btn primary', disabled: true, onclick: function () { edit(null, state.roles, state.estate); } }, icon('plus'), 'New user');
  root.appendChild(pageHead('Users', 'Create accounts, choose each person\'s job role, and give every AFO their own fields.',
    newUserBtn));
  root.appendChild(out);
  refresh();

  let state = null;
  const search = h('input', { type: 'search', placeholder: 'Search name or username' });
  const roleF = h('select');
  const listBox = h('div');
  search.addEventListener('input', renderList); roleF.addEventListener('change', renderList);

  function refresh() {
    Promise.all([api('api_listUsers'), api('api_listRoles'), api('api_getEstate')]).then(function (res) {
      state = { users: res[0], roles: res[1].filter(function (r) { return r.active; }), estate: res[2] };
      newUserBtn.disabled = false;
      const keep = roleF.value;
      clear(roleF); roleF.appendChild(h('option', { value: '' }, 'All roles'));
      state.roles.forEach(function (r) { roleF.appendChild(h('option', { value: r.role_id }, r.role_name)); });
      roleF.value = keep;
      clear(out);
      const active = state.estate.fields.filter(function (f) { return f.active; });
      const unassigned = active.filter(function (f) { return !f.afo_user_id; }).length;
      out.appendChild(h('div', { class: 'card flush' },
        h('div', { class: 'row', style: 'padding:16px;align-items:center' }, h('div', { class: 'grow', style: 'flex-basis:260px' }, search), h('div', { class: 'grow', style: 'flex-basis:180px;max-width:240px' }, roleF),
          state.estate.estate ? h('span', { class: 'muted small' }, unassigned + ' of ' + active.length + ' fields have no AFO yet') : null),
        listBox));
      renderList();
    }).catch(function (e) { clear(out).appendChild(msgBox('err', e.message)); });
  }
  function renderList() {
    const q = search.value.trim().toLowerCase();
    const users = state.users.filter(function (u) { return (!q || (u.display_name + ' ' + u.username).toLowerCase().indexOf(q) >= 0) && (!roleF.value || u.role_id === roleF.value); });

<script>
'use strict';
/* ===== Small drawing helpers shared by the screens: SVG elements, round axis steps, and the small KPI tile of the Home screen. =====
   (The earlier all-in-one summary dashboard was removed; the Monitoring screens are built piece by piece in JsMonitor.html.) */

function svgEl(tag, attrs, text) {

  for (const k in (attrs || {})) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  return e;
}
function niceStep(raw) { if (!(raw > 0)) return 1; const p = Math.pow(10, Math.floor(Math.log10(raw))); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }

  return h('div', { class: 'kpi ' + kind }, h('div', { class: 'k-label' }, icon(ic || 'leaf'), label), h('div', { class: 'k-val' }, value), h('div', { class: 'k-sub' }, sub || ''));

<script>
'use strict';
/* ===== Monitoring: Operation monitoring (Plucking rounds, Foliar rounds) and Experiment monitoring =====
 *  The rounds are drawn as a timeline after GreenLens v3: one row per field on a shared date axis that scrolls sideways. Each round is a small PROGRESS BAR that
 *  starts on the day the round started: the filled part is the % covered in that round (full = finished). A field sprayed or plucked partly by drone and partly
 *  by hand has TWO LINES, drone (blue) above manual (orange): the two parts have SEPARATE rounds (the drone part can be on its third round while the manual part
 *  is on its second), each with its own bars, % at the right end of the bar, gaps and counts. A round still going on has a striped moving fill; a round left
 *  unfinished (nothing more came within the waiting limit) keeps its partly filled solid bar. Between two rounds of a line: a line in the method's colour with a
 *  pill, the days between their first days, green within the target gap, red with the days beyond it when later. kg above and days below each round; each
 *  month shows how many rounds started in it. Nothing is drawn on top of anything else: the bar, its % and the gap line are fitted into the room between one
 *  round and the next. */

const MON_PX = { small: 12, normal: 22, large: 34 };
const MON_DAY = 86400000;
const monDay = function (iso) { return Math.floor(new Date(iso + 'T00:00:00Z').getTime() / MON_DAY); };
const daysWord = function (n) { return n + (n === 1 ? ' day' : ' days'); };

/** The method badge of a field; a field sprayed partly by drone says how much. */
function mixedBadge(f) {
  const b = methodBadge(f.method);
  if (f.method === 'Mixed') b.setAttribute('title', r2(f.drone_ha) + ' ha by drone and ' + r2(f.area_ha - f.drone_ha) + ' ha by hand (' + f.drone_pct + '% drone)');
  return b;
}
/** The timeline for one list of fields. d: {today, from, to, target_gap, fields:[{code, division, method, area_ha, avg_per_month, rounds:[...]}]}. what: words for the tooltips. */
function roundsTimeline(d, zoom, what) {
  const px = MON_PX[zoom] || MON_PX.normal, first = monDay(d.from), last = monDay(d.to) + 3, total = last - first + 1, laneW = total * px;
  const X = function (iso) { return (monDay(iso) - first) * px; };                                         // where a day starts on the lane, in pixels
  const todayAt = (monDay(d.today) + 1 - first) / total * 100, labels = px >= 20;

  const months = [];                                                   // the calendar months inside the window
  for (let day = first; day <= last;) {
    const dt = new Date(day * MON_DAY), monthEnd = Math.min(last, Math.floor(Date.UTC(dt.getUTCFullYear(), dt.getUTCMonth() + 1, 0) / MON_DAY));
    months.push({ key: dt.toISOString().slice(0, 7), name: dt.toLocaleDateString('en-GB', { month: 'short', year: 'numeric', timeZone: 'UTC' }), at: (day - first) / total * 100, width: (monthEnd - day + 1) / total * 100 });
    day = monthEnd + 1;
  }

  const head = h('tr', null, h('th', { class: 'mon-field', scope: 'col' }, 'Field'),
    h('th', { class: 'mon-axis', scope: 'col', style: 'min-width:' + laneW + 'px;width:' + laneW + 'px' }, h('div', { style: 'position:relative;height:100%;width:' + laneW + 'px' },
      months.map(function (m) { return h('span', { style: 'left:' + m.at + '%' }, m.name); }))));
  const body = h('tbody');
  groupBy(d.fields, function (f) { return f.division || ''; }).forEach(function (g) {
    body.appendChild(h('tr', { class: 'mon-div' }, h('th', { colspan: '2', scope: 'colgroup' }, h('div', { class: 'mon-divtxt' }, (g.key || 'Fields') + '  |  ' + g.items.length + (g.items.length === 1 ? ' field' : ' fields')))));
    g.items.forEach(function (f) { body.appendChild(fieldRow(f)); });
  });

  function fieldRow(f) {
    const rows = f.rows, two = rows.length === 2, ROWH = 52, TOP0 = 8, MIN_ROOM = 56, BLOCK = 110, LABEL = 40;
    const lane = h('div', { class: 'lane' + (two ? ' two' : ''), style: 'width:' + laneW + 'px;min-width:' + laneW + 'px' });
    months.forEach(function (m, i) {                                    // month bands, with how many rounds started in each (a field with two parts: drone | manual)
      const ns = rows.map(function (r) { return (r.months.filter(function (x) { return x.month === m.key; })[0] || { n: 0 }).n; }), total = ns.reduce(function (a, n) { return a + n; }, 0);
      const chip = two
        ? h('b', { class: 'chip2' + (total === 0 ? ' none' : '') }, h('span', { class: 'd' }, String(ns[0])), h('span', { class: 'sep' }, '|'), h('span', { class: 'm' }, String(ns[1])), labels ? ' rounds' : null)
        : h('b', { class: total === 0 ? 'none' : '' }, labels ? total + (total === 1 ? ' round' : ' rounds') : String(total));
      lane.appendChild(h('i', { class: 'band' + (i % 2 ? ' odd' : ''), style: 'left:' + m.at + '%;width:' + m.width + '%',
        title: (two ? 'Drone part: ' + ns[0] + ', manual part: ' + ns[1] + ' rounds started' : total + (total === 1 ? ' round started' : ' rounds started')) + ' in ' + m.name }, chip));
    });
    lane.appendChild(h('i', { class: 'today', style: 'left:' + todayAt + '%', 'aria-hidden': 'true' }));
    // each part of the field (one row, or two for a drone part and a manual part) has ITS OWN rounds, laid out on its own line
    rows.forEach(function (row, ri) {
      const m = row.method, name = m.toLowerCase(), y0 = TOP0 + ri * ROWH, cy = y0 + 25;
      const its = row.rounds.map(function (r) { return { r: r, x: X(r.start) }; });
      its.forEach(function (it, i) {                                    // how much room each round has before the next one in this row
        const next = its[i + 1]; it.room = next ? next.x - it.x : Infinity;
        it.total = next ? Math.max(6, Math.min(BLOCK, Math.max(it.room - MIN_ROOM, Math.min(26, it.room - 3)))) : BLOCK;     // leave room for the gap line and its pill; never wider than the room before the next round
        it.showPct = it.total >= 76; it.bar = it.showPct ? it.total - LABEL : it.total;
      });
      its.forEach(function (it, i) {                                    // the gap line to the previous round, in the colour of the method
        const prev = its[i - 1];
        if (!prev || it.r.gap === '') return;
        const a = prev.x + prev.total + 3, b = it.x - 3, wd = b - a, late = it.r.late > 0;

  });

      items.forEach(function (it, i) {
        const below = close && i === 1, ty = Math.min(Math.max(below ? it.y + 19 : it.y - 10, TOP + 9), TOP + plotH - 6);

  svg.appendChild(guide);
  const keys = Object.keys(ser.keys).map(function (k) { return ser.keys[k]; }).sort(function (a, b) { return a.t - b.t; });
  const hide = function () { guide.setAttribute('visibility', 'hidden'); tip.style.display = 'none'; };
  const show = function (e) {
    const r = svg.getBoundingClientRect(); if (!r.width || !keys.length) return;
    const px = (e.clientX - r.left) * (W / r.width), t = first + (px - G0) / (W - G0 - R) * span;
    let best = keys[0]; keys.forEach(function (k) { if (Math.abs(k.t - t) < Math.abs(best.t - t)) best = k; });
    if (Math.abs(X(best.t) - px) > (period === 'day' ? 22 : 60)) { hide(); return; }
    guide.setAttribute('x1', X(best.t)); guide.setAttribute('x2', X(best.t)); guide.setAttribute('visibility', 'visible');

/** The one number users read: all the data, drone against manual. A KPI card: the KPI's name, the big percentage with an arrow, one line saying what it means, and the

  if (dv === null || mv === null || mv === 0) {

    h('div', { class: 'eh-sub' }, same ? M.title + ' is about the same for drones and manual spraying.' : w[1] + ', all time'), bars);
}

function experimentScreen(host) {
  let period = EXP_PERIODS.some(function (p) { return p[0] === S.expPeriod; }) ? S.expPeriod : 'day', data = null;
  S.expOpen = S.expOpen || {};                                                   // which KPI card has its graph unfolded (all folded to begin with)

    body.appendChild(h('div', { class: 'exp-heads' }, kpiCard('eff'), kpiCard('mat'), kpiCard('speed'), kpiCard('cost'), kpiCard('leaf')));

<script>
'use strict';
/* ===== Field history: for AFOs and drone pilots (and the Admin), the rounds and entries of each of their fields =====
 *  A list of the person's fields (last plucking, last foliar, how many rounds); tap one to see its rounds, newest first: dates, how much of the field (or of its
 *  drone / manual part) was covered, kg, kg per ha, the gap since the round before, and every entry inside the round. A field sprayed partly by drone and partly
 *  by hand shows its drone part and its manual part as two blocks, each with its own rounds. Read only; needs signal. */

const HX_KINDS = { spray: 'Foliar spray', pluck: 'Plucking' };
const HX_FIRST = 8;                                                            // rounds shown before "Show earlier rounds"
const hxDays = function (n) { return n + (n === 1 ? ' day' : ' days'); };
const hxState = function (r) { return r.complete ? 'done' : (r.expired ? 'part' : 'ongoing'); };
const hxBar = function (r, method) { return h('span', { class: 'pb ' + method.toLowerCase() + ' ' + hxState(r), style: 'position:relative;display:block;width:100%;height:14px' }, h('i', { class: 'fill', style: 'width:' + r.percent + '%' })); };

function hxEntry(kind, method, e) {
  const who = e.by ? '  |  ' + e.by : '';
  if (kind === 'pluck') return h('li', null, h('b', null, shortDate(e.date)), '  ' + num(e.kg, 1) + ' kg from ' + r2(e.ha) + ' ha  (round at ' + e.reached + '%)' + who);
  const crew = e.units ? e.units + (method === 'Drone' ? (e.units === 1 ? ' drone' : ' drones') : (e.units === 1 ? ' man' : ' men')) : '';
  return h('li', null, h('b', null, shortDate(e.date)), '  ' + (e.start_time ? e.start_time + ' to ' + e.end_time + '  |  ' : '') + (crew ? crew + '  |  ' : '') + num(e.kg, 1) + ' kg on ' + r2(e.ha) + ' ha  (part at ' + e.reached + '%)' + who);
}

function hxRound(kind, method, r, target) {
  const state = hxState(r), tag = state === 'done' ? 'Finished' : (state === 'part' ? 'Left unfinished' : 'Going on');
  const gap = r.gap === '' ? null : h('div', { class: 'hx-gap ' + (r.late > 0 ? 'late' : 'ok') }, hxDays(r.gap) + ' after round ' + (r.no - 1) + ' started' + (r.late > 0 ? '  |  ' + hxDays(r.late) + ' later than the ' + hxDays(target) + ' target' : '  |  on time'));
  return h('div', { class: 'hx-round ' + state, 'data-round': String(r.no) },
    h('div', { class: 'hx-top' }, h('b', { class: 'hx-no' }, 'Round ' + r.no), h('span', { class: 'hx-tag ' + state }, tag),
      h('span', { class: 'hx-dates' }, shortDate(r.start) + (r.end !== r.start ? ' to ' + shortDate(r.end) : '') + '  |  ' + hxDays(r.days))),
    h('div', { class: 'hx-bar' }, hxBar(r, method), h('b', { class: 'hx-pct' }, r.percent + '%')),
    h('div', { class: 'hx-nums' }, h('span', null, h('b', null, num(r.kg, 1)), ' kg'), r.kg_per_ha !== '' ? h('span', null, h('b', null, num(r.kg_per_ha, 1)), ' kg/ha') : null, h('span', null, h('b', null, r2(r.done_ha)), ' of ' + r2(r.ha) + ' ha'),
      kind === 'spray' ? h('span', null, h('b', null, String(r.events)), r.events === 1 ? ' spray event' : ' spray events') : null),
    gap,
    h('details', { class: 'hx-det' }, h('summary', null, r.entries.length + (r.entries.length === 1 ? ' entry' : ' entries')), h('ul', null, r.entries.map(function (e) { return hxEntry(kind, method, e); }))));
}

function hxPart(kind, part, field, target, mixed) {
  const box = h('div', { class: 'hx-part ' + part.method.toLowerCase() });
  if (mixed) box.appendChild(h('div', { class: 'hx-parthead' }, h('i', { class: 'dot ' + part.method.toLowerCase() }), part.method + ' part', h('span', { class: 'muted' }, '  ' + r2(part.ha) + ' ha')));
  if (!part.rounds.length) { box.appendChild(h('div', { class: 'muted small', style: 'padding:6px 0' }, 'No ' + (kind === 'spray' ? 'spraying' : 'plucking') + ' recorded yet.')); return box; }
  const unfinished = part.n_rounds - part.n_complete;
  box.appendChild(h('div', { class: 'hx-sum muted small' }, part.n_rounds + (part.n_rounds === 1 ? ' round' : ' rounds') + '  |  ' + part.n_complete + ' finished' + (unfinished ? '  |  ' + unfinished + ' not finished' : '')));
  const list = h('div', { class: 'hx-rounds' });
  const draw = function (all) {
    clear(list);
    part.rounds.slice(0, all ? part.rounds.length : HX_FIRST).forEach(function (r) { list.appendChild(hxRound(kind, part.method, r, target)); });
    if (!all && part.rounds.length > HX_FIRST) list.appendChild(h('button', { type: 'button', class: 'btn', onclick: function () { draw(true); } }, 'Show earlier rounds (' + (part.rounds.length - HX_FIRST) + ')'));
  };
  draw(false); box.appendChild(list);
  return box;
}

function hxField(host, d, back) {
  const f = d.field, mixed = f.method === 'Mixed';
  let kind = S.hxKind && d.kinds.some(function (k) { return k.kind === S.hxKind; }) ? S.hxKind : d.kinds[0].kind;
  const body = h('div'), seg = h('div', { class: 'seg', role: 'tablist', 'aria-label': 'History' });
  const help1 = help(h('div', null, 'A round is all the entries on the same part of a field, up to a few days apart: foliar spray up to ' + hxDays(d.kinds.filter(function (k) { return k.kind === 'spray'; }).map(function (k) { return k.reset_days; })[0] || 3) + ', plucking up to ' + hxDays(d.kinds.filter(function (k) { return k.kind === 'pluck'; }).map(function (k) { return k.reset_days; })[0] || 2) + '. The next entry after that starts a new round. The bar shows how much of the field (or of its drone or manual part) was covered in the round; a full bar means finished, "Left unfinished" means nothing more came in time. The gap counts the days between the first days of two rounds. A field sprayed partly by drone and partly by hand shows its two parts separately, each with its own rounds.'), 'How to read this');
  host.appendChild(h('div', { class: 'hx-back' }, h('button', { type: 'button', class: 'btn', onclick: back }, icon('left'), 'All fields')));
  host.appendChild(h('div', { class: 'hx-head' }, h('b', { class: 'code' }, (f.division ? f.division + ' ' : '') + f.code), methodBadge(f.method), h('span', { class: 'muted' }, (f.name ? f.name + '  |  ' : '') + r2(f.area_ha) + ' ha' + (mixed ? '  (' + r2(f.drone_ha) + ' drone, ' + r2(f.manual_ha) + ' manual)' : '')), help1));
  if (d.kinds.length > 1) { d.kinds.forEach(function (k) { seg.appendChild(h('button', { type: 'button', role: 'tab', 'data-kind': k.kind, onclick: function () { kind = k.kind; S.hxKind = kind; draw(); } }, HX_KINDS[k.kind])); }); host.appendChild(h('div', { class: 'mon-ctl' }, seg)); }
  host.appendChild(body);
  function draw() {
    Array.prototype.forEach.call(seg.children, function (b) { const on = b.getAttribute('data-kind') === kind; b.classList.toggle('on', on); b.setAttribute('aria-selected', on ? 'true' : 'false'); });
    clear(body);
    const k = d.kinds.filter(function (x) { return x.kind === kind; })[0];
    k.parts.forEach(function (p) { body.appendChild(hxPart(kind, p, f, k.target_gap, mixed)); });
  }
  draw();
}

VIEWS['history.view'] = function (root) {
  const page = h('div');
  root.appendChild(pageHead('Field history', 'Pick a field to see its rounds and what was entered.'));
  root.appendChild(page);
  list();

  function list() {
    clear(page); S.hxField = '';
    page.appendChild(skeleton(4));
    api('api_historyFields').then(function (d) {
      clear(page);
      if (!d.fields.length) { page.appendChild(h('div', { class: 'card' }, emptyState('You have no fields yet.', 'map'))); return; }
      let q = '';
      const search = h('input', { type: 'search', placeholder: 'Find a field', 'aria-label': 'Find a field' }), box = h('div', { class: 'hx-list' });
      search.addEventListener('input', function () { q = search.value; draw(); });
      page.appendChild(h('div', { class: 'row', style: 'margin-bottom:12px;max-width:360px' }, search)); page.appendChild(box);
      function draw() {
        clear(box);
        const t = q.trim().toLowerCase(), fields = d.fields.filter(function (f) { return !t || (f.code + ' ' + f.name + ' ' + f.division).toLowerCase().indexOf(t) >= 0; });
        if (!fields.length) { box.appendChild(h('div', { class: 'muted small' }, 'No field matches.')); return; }
        groupBy(fields, function (f) { return f.division || ''; }).forEach(function (g) {
          if (g.key) box.appendChild(h('div', { class: 'divhead fdiv' }, h('span', null, g.key)));
          const grid = h('div', { class: 'hx-rows' });
          g.items.forEach(function (f) {
            const line = function (k) { const x = f[k]; return h('span', { class: 'hx-l' }, h('i', null, HX_KINDS[k]), x.rounds ? 'last ' + shortDate(x.last) + '  |  ' + x.rounds + (x.rounds === 1 ? ' round' : ' rounds') : 'none yet'); };
            grid.appendChild(h('button', { type: 'button', class: 'hxrow', 'data-code': f.code, onclick: function () { open(f.field_id); } },
              h('span', { class: 'hx-c' }, h('b', null, f.code), methodBadge(f.method), h('small', null, r2(f.area_ha) + ' ha')), d.kinds.map(line)));
          });
          box.appendChild(grid);
        });
      }
      draw();
    }).catch(function (e) { clear(page); page.appendChild(msgBox('err', e.message)); });
  }
  function open(id) {
    S.hxField = id; clear(page); page.appendChild(skeleton(4));
    api('api_fieldHistory', id).then(function (d) { clear(page); hxField(page, d, list); window.scrollTo(0, 0); }).catch(function (e) { clear(page); page.appendChild(h('div', { class: 'hx-back' }, h('button', { type: 'button', class: 'btn', onclick: list }, icon('left'), 'All fields'))); page.appendChild(msgBox('err', e.message)); });
  }
};
</script>

<script>
// Install gate for the hosted phone-app version (inlined into pwa/index.html by tools/build-pwa.js).
// Opened in an ordinary browser tab -> ONLY an "Install the app" screen is shown. Opened from the home-screen icon (installed) -> the app starts.
// This is a convenience for staff, not a security measure: the login still protects all data.
(function () {
  function standalone() {
    try {
      if (window.matchMedia && (matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || matchMedia('(display-mode: minimal-ui)').matches)) return true;
    } catch (e) { /* ignore */ }
    return window.navigator.standalone === true;          // iPhone
  }
  if (standalone()) { boot(); return; }

  var ua = navigator.userAgent || '';
  var ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var iosSafari = ios && !/CriOS|FxiOS|EdgiOS|OPiOS|GSA\//.test(ua);
  var deferred = null, installed = false, copied = false;

  var css = document.createElement('style');
  css.textContent =
    'html,body{margin:0;min-height:100%;background:#0e3a29}' +
    '.ig{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(160deg,#0e3a29,#1d6b47)}' +
    '.ig-card{width:100%;max-width:400px;background:#fff;color:#16261f;border-radius:20px;padding:28px 24px;box-shadow:0 20px 50px rgba(0,0,0,.35);text-align:center}' +
    '.ig-card img{width:72px;height:72px;border-radius:16px}' +
    '.ig-card h1{font-size:22px;margin:16px 0 8px}' +
    '.ig-card p{font-size:15px;line-height:1.5;margin:0 0 16px;color:#44564d}' +
    '.ig-btn{display:block;width:100%;box-sizing:border-box;border:0;border-radius:12px;padding:15px;font-size:17px;font-weight:600;color:#fff;background:#1d6b47;cursor:pointer;margin:6px 0 4px}' +
    '.ig-btn.alt{background:#e8f1ec;color:#14502f}' +
    '.ig-steps{text-align:left;margin:8px 0 4px;padding:0;list-style:none;counter-reset:s}' +
    '.ig-steps li{counter-increment:s;position:relative;padding:10px 0 10px 40px;font-size:15px;line-height:1.45;border-top:1px solid #e3ebe6}' +
    '.ig-steps li:first-child{border-top:0}' +
    '.ig-steps li:before{content:counter(s);position:absolute;left:0;top:9px;width:26px;height:26px;border-radius:50%;background:#e8f1ec;color:#14502f;font-weight:700;font-size:14px;text-align:center;line-height:26px}' +
    '.ig-note{font-size:13px;color:#6b7c73;margin-top:14px}' +
    '.ig-ok{width:56px;height:56px;border-radius:50%;background:#e1f3e8;color:#1d6b47;font-size:32px;line-height:56px;margin:0 auto}' +
    '.ig-ico{display:inline-block;vertical-align:-4px;width:20px;height:20px}';
  document.head.appendChild(css);

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
  function steps(list) { var ol = el('ol', 'ig-steps'); list.forEach(function (t) { var li = el('li'); if (typeof t === 'string') li.textContent = t; else t.forEach(function (n) { li.appendChild(typeof n === 'string' ? document.createTextNode(n) : n); }); ol.appendChild(li); }); return ol; }
  function shareIcon() { var s = el('span', 'ig-ico'); s.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#1d6b47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M8 7l4-4 4 4M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>'; return s; }

  function render() {
    var root = document.getElementById('app'); root.textContent = '';
    var wrap = el('div', 'ig'), card = el('div', 'ig-card'); wrap.appendChild(card); root.appendChild(wrap);
    if (installed) {
      card.appendChild(el('div', 'ig-ok', '✓'));
      card.appendChild(el('h1', '', 'App installed'));
      card.appendChild(el('p', '', 'Close this page and open "Foliar Spray" from the icon on your home screen. That is where you log in and use the app.'));
      return;
    }
    var img = el('img'); img.src = 'icon-192.png'; img.alt = ''; card.appendChild(img);
    card.appendChild(el('h1', '', 'Install the Foliar Spray app'));
    card.appendChild(el('p', '', 'To use this app you need to install it on your phone first. Once installed it opens from your home screen, even with no signal.'));
    if (deferred) {
      var b = el('button', 'ig-btn', 'Install app'); b.type = 'button';
      b.onclick = function () {
        var d = deferred; deferred = null;
        d.prompt();
        Promise.resolve(d.userChoice).then(function (c) { if (c && c.outcome === 'accepted') installed = true; render(); }, render);
      };
      card.appendChild(b);
    } else if (ios && iosSafari) {
      card.appendChild(steps([[ 'Tap the Share button ', shareIcon(), ' at the bottom of the screen.' ], 'Scroll down and tap "Add to Home Screen".', 'Tap "Add". Then open "Foliar Spray" from your home screen.']));
    } else if (ios) {
      card.appendChild(el('p', '', 'On an iPhone the app can only be installed from Safari. Open this same address in Safari, then follow the steps shown there.'));
      var c = el('button', 'ig-btn alt', copied ? 'Link copied' : 'Copy link'); c.type = 'button';
      c.onclick = function () { try { navigator.clipboard.writeText(location.href.split('#')[0]).then(function () { copied = true; render(); }); } catch (e) { /* ignore */ } };
      card.appendChild(c);
    } else {
      card.appendChild(steps(['Open the browser menu (the three dots at the top right).', 'Tap "Install app" (or "Add to Home screen").', 'Tap "Install". Then open "Foliar Spray" from your home screen.']));
      card.appendChild(el('p', 'ig-note', 'Not seeing "Install app"? Open this address in Google Chrome.'));
    }
    card.appendChild(el('p', 'ig-note', 'Already installed? Open it from the icon on your home screen.'));
  }

  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; render(); });
  window.addEventListener('appinstalled', function () { installed = true; deferred = null; render(); });
  render();
})();
</script>
